<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página en Construcción Interactiva</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to bottom, #f0f0f0, #c0c0c0);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  h1, p {
    text-align: center;
  }

  h1 { 
    margin-top: 5vh; 
    color: #333; 
    font-size: 8vw; /* Escalable */
  }

  p { 
    color: #555; 
    margin: 2vh 5vw; 
    max-width: 90%; 
    font-size: 8vw;
  }

  .ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 2vh;
    background: linear-gradient(to right, #aaa, #888);
  }

  /* Pez estilo caricatura */
  .fish {
    position: absolute;
    bottom: 10vh;
    width: 12vw;
    max-width: 70px;
    height: 6vw;
    max-height: 35px;
    background-color: #1E90FF;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }

  .fish::after {
    content: '';
    width: 4vw;
    max-width: 20px;
    height: 4vw;
    max-height: 20px;
    background-color: #1E90FF;
    clip-path: polygon(100% 50%, 0 0, 0 100%);
    position: absolute;
    left: -15%;
  }

  .eye {
    width: 1.5vw;
    max-width: 8px;
    height: 1.5vw;
    max-height: 8px;
    background-color: white;
    border-radius: 50%;
    margin-right: 5px;
    position: relative;
  }

  .eye::after {
    content: '';
    width: 0.7vw;
    max-width: 4px;
    height: 0.7vw;
    max-height: 4px;
    background-color: black;
    border-radius: 50%;
    position: absolute;
    top: 25%;
    left: 25%;
  }

  footer {
    width: 100%;
    text-align: center;
    padding: 2vh 0;
    background-color: #ddd;
  }

  .btn {
    padding: 2vh 5vw;
    background-color: #515177;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 4vw;
    transition: background 0.3s;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 50px;
  }

  .btn:hover {
    background-color: #104E8B;
  }

  /* Ajustes extra para pantallas grandes */
  @media (min-width: 768px) {
    h1 { font-size: 2.5em; }
    p { font-size: 1.2em; }
    .btn { font-size: 1em; padding: 12px 25px; margin-bottom: 50px; }
  }


</style>
</head>
<body>

<h1>Página en Construcción</h1>
<p>Disculpa la molestia</p>

<div class="fish" id="fish">
  <div class="eye"></div>
</div>
<div class="ground"></div>

<footer>
  <a href="MenuDisipulados.html" class="btn">Ir a la Página Principal</a>
</footer>

<script>
  const fish = document.getElementById('fish');
  let direction = 1; // 1 = derecha, -1 = izquierda
  let speed = 2; // píxeles por frame
  let position = 0;

  function moveFish() {
    const screenWidth = window.innerWidth;
    position += speed * direction;

    if(position > screenWidth - 70) direction = -1;
    if(position < 0) direction = 1;

    fish.style.left = position + 'px';
    requestAnimationFrame(moveFish);
  }

  // Iniciar animación
  moveFish();

  // Al hacer clic cambia dirección y velocidad
  fish.addEventListener('click', () => {
    direction *= -1;
    speed = Math.random() * 5 + 1; // nueva velocidad aleatoria
  });

  fish.addEventListener('touchstart', () => {
    direction *= -1;
    speed = Math.random() * 5 + 1;
  });
</script>

</body>
</html>
